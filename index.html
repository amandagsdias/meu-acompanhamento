<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087F8C">
<meta name="description" content="Acompanhe peso, refeições, água, exercícios e aplicações em um só lugar.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Meu acompanhamento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#F3F6FA;--sf:#FFFFFF;--tx:#172B4D;--mut:#64748B;--pr:#087F8C;--on:#FFFFFF;--pr2:#DDF3F4;--ac:#7251A3;--ac2:#EEE7F8;--ln:#E1E8F0;--ok:#16856B;--warn:#B45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101820;--sf:#182530;--tx:#E6EDF5;--mut:#A0B0C0;--pr:#55C5CC;--on:#09272A;--pr2:#203D44;--ac:#C4A8EA;--ac2:#342B45;--ln:#2A3C49;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101820;--sf:#182530;--tx:#E6EDF5;--mut:#A0B0C0;--pr:#55C5CC;--on:#09272A;--pr2:#203D44;--ac:#C4A8EA;--ac2:#342B45;--ln:#2A3C49;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.55 Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums} 
#app{animation:fadein .25s ease-out} @keyframes fadein{from{opacity:.65;transform:translateY(3px)}to{opacity:1;transform:none}}
#app{max-width:760px;margin:0 auto;padding:22px 16px 105px}
h1{font-size:22px;letter-spacing:-.6px;font-weight:800;margin:0}
h2{font-size:16px;font-weight:800;margin:0 0 10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dn{display:flex;align-items:center;gap:6px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px rgba(24,48,70,.035)}
button{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:11px;padding:10px 14px;background:var(--pr);color:var(--on);cursor:pointer;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.04)}button:active{transform:scale(.98)}
button.g{background:var(--pr2);color:var(--tx)}
.dn button{background:var(--pr2);color:var(--tx);padding:6px 12px}
.x{background:none;color:var(--mut);font-size:19px;padding:2px 8px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:11px;padding:11px 12px;min-width:0;width:100%;outline-offset:2px}input::placeholder{color:var(--mut);opacity:.8}
input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:8px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row input{flex:1 1 120px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.mut,small{color:var(--mut)}
.big{font-size:32px;letter-spacing:-1px;font-weight:800;margin:0 0 8px}.big small{font-size:13px;font-weight:600;letter-spacing:0}
.bar{height:8px;border-radius:6px;background:var(--pr2);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.m{margin-bottom:10px}.ml{display:flex;justify-content:space-between;margin-bottom:4px}
.ac .bar{background:var(--ac2)}.ac button{background:var(--ac);color:var(--bg)}
.nx{font-size:22px;font-weight:800;margin:0}
details{margin-top:8px}summary{cursor:pointer;color:var(--mut);font-weight:600}
label.f{display:block;font-size:13px;color:var(--mut);margin-top:8px}
svg{width:100%;height:auto;display:block;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;text-align:left;border-top:1px solid var(--ln)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:11px 14px calc(11px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln);box-shadow:0 -5px 24px rgba(24,48,70,.06);z-index:5}
nav button{flex:1;max-width:220px;background:transparent;color:var(--mut);border:1px solid var(--ln)}nav button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.hero{background:linear-gradient(135deg,var(--pr2),var(--sf) 78%);border-radius:20px;padding:20px;margin-bottom:14px;border:1px solid var(--ln)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:800}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--bg);border-radius:13px;padding:12px}.stat b{display:block;font-size:20px;letter-spacing:-.5px}.stat span{font-size:11px;color:var(--mut)}.hint{font-size:12px;color:var(--mut);margin:8px 0 0}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--pr2);font-size:11px;font-weight:800;color:var(--tx)}.symptoms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.symptoms label{margin:0;background:var(--bg);border-radius:10px;padding:9px;font-size:13px;color:var(--tx)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1 1 130px}@media(min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.symptoms{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){#app{padding:14px 10px 100px}.card{padding:14px;border-radius:15px}h1{font-size:19px}.big{font-size:28px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.row{gap:6px}.row button{flex:1}}
.meal-block{border:1px solid var(--ln);border-radius:13px;padding:11px;margin:10px 0;background:color-mix(in srgb,var(--bg) 45%,var(--sf))}.meal-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.meal-heading h3{font-size:14px;margin:0;font-weight:800}.meal-heading span{font-weight:800;color:var(--pr)}.meal-total{font-size:12px;color:var(--mut);margin:8px 0 0;padding-top:8px;border-top:1px solid var(--ln)}
.food-tools{display:grid;grid-template-columns:1fr;gap:8px}.food-table-wrap{overflow:auto;border:1px solid var(--ln);border-radius:12px;margin-top:12px}table.food-table{min-width:650px;font-size:12px}table.food-table th{position:sticky;top:0;background:var(--bg);z-index:1;color:var(--mut);font-size:11px}table.food-table td,table.food-table th{padding:9px 8px;white-space:nowrap}table.food-table tr:nth-child(even){background:color-mix(in srgb,var(--bg) 60%,var(--sf))}.food-name{white-space:normal!important;min-width:210px;max-width:300px}.nutri-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.nutri-detail div{background:var(--bg);padding:9px;border-radius:10px}.nutri-detail b{display:block;font-size:14px}.nutri-detail span{font-size:11px;color:var(--mut)}.source-note{font-size:11px;color:var(--mut);line-height:1.5}@media(min-width:620px){.food-tools{grid-template-columns:2fr 1fr}.nutri-detail{grid-template-columns:repeat(3,minmax(0,1fr))}}
.taco-inline{margin-top:10px;padding:12px;border-radius:12px;background:var(--sf);border:1px solid var(--ln)}.taco-results{display:grid;gap:6px;max-height:270px;overflow:auto;margin-top:8px}.taco-result{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--ln);padding:9px 10px}.taco-result small{font-size:11px;color:var(--mut)}.taco-result.chosen{border-color:var(--pr);background:var(--pr2)}.taco-selected{margin-top:12px;padding-top:12px;border-top:1px solid var(--ln)}.taco-selected h3{font-size:14px;margin:0 0 8px}.barcode-tools{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln)}.barcode-video{width:100%;max-height:260px;object-fit:cover;border-radius:12px;background:#111;margin-top:8px}.barcode-status{font-size:12px;color:var(--mut);margin:6px 0}.barcode-product{border:1px solid var(--ln);padding:10px;border-radius:12px;margin-top:10px}.fav-tools{margin-top:10px;padding:9px 10px;border:1px solid var(--ln);border-radius:10px}.fav-list{display:grid;gap:6px;margin-top:8px}.fav-item{display:flex;align-items:center;gap:6px}.fav-item button:first-child{flex:1;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--ln);font-weight:600}.tiny-action{padding:6px 8px;font-size:11px}.save-status{font-size:11px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<div id="app">Carregando…</div>
<nav id="nav"></nav>
<script>
const LS='ozivy-app-v1';
let S,cur,tab='hoje',dbRef=null,tm;
let tacoFoods=[],tacoStatus='idle',selectedTaco=null,tacoMealActive='',tacoSearchQuery='';
let barcodeScannerOpen=false,barcodeStream=null,barcodeFrame=0,barcodeBusy=false,barcodeStatus='',barcodeProduct=null,barcodeMeal='cafe';
const TACO_URL='https://raw.githubusercontent.com/brolesi/taco/main/data/processed/taco/taco_composicao.csv';
const MEALS=[['cafe','Café da manhã'],['almoco','Almoço'],['lanche','Café da tarde'],['jantar','Jantar']];
const mealName=k=>(MEALS.find(x=>x[0]===k)||['outro','Outra refeição'])[1];
const TACO_FIELDS=[
 ['energia_kcal','Energia','kcal'],['energia_kj','Energia','kJ'],['proteina_g','Proteína','g'],
 ['lipideos_g','Lipídeos totais','g'],['carboidrato_g','Carboidratos','g'],['fibra_g','Fibra alimentar','g'],
 ['colesterol_mg','Colesterol','mg'],['umidade_pct','Umidade','g'],['cinzas_g','Cinzas','g'],
 ['calcio_mg','Cálcio','mg'],['magnesio_mg','Magnésio','mg'],['manganes_mg','Manganês','mg'],
 ['fosforo_mg','Fósforo','mg'],['ferro_mg','Ferro','mg'],['sodio_mg','Sódio','mg'],
 ['potassio_mg','Potássio','mg'],['cobre_mg','Cobre','mg'],['zinco_mg','Zinco','mg'],
 ['retinol_mcg','Retinol','µg'],['RE_mcg','Equivalente de retinol (RE)','µg'],['RAE_mcg','Atividade de retinol (RAE)','µg'],
 ['tiamina_mg','Vitamina B1','mg'],['riboflavina_mg','Vitamina B2','mg'],['piridoxina_mg','Vitamina B6','mg'],
 ['niacina_mg','Vitamina B3','mg'],['vitamina_c_mg','Vitamina C','mg']
];
function parseCSV(text){
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}
  else if(c==='"')quoted=true;
  else if(c===','){row.push(field);field=''}
  else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}
  else field+=c;
 }
 if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}
 const headers=rows.shift()||[];
 return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??'').trim()])));
}
async function loadTaco(){
 if(tacoStatus==='loading'||tacoStatus==='loaded')return;
 tacoStatus='loading';
 try{
  const res=await fetch(TACO_URL,{cache:'force-cache'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  tacoFoods=parseCSV(await res.text());
  if(!tacoFoods.length)throw new Error('Tabela vazia');
  tacoStatus='loaded';
 }catch(e){tacoStatus='error'}
 if(tab==='alimentos'||tab==='hoje')render();
}
const tacoNum=v=>{if(v===undefined||v===null||v===''||v==='NA'||v==='—')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const tacoFmt=(v,d=1)=>{if(v===undefined||v===null||v===''||v==='NA')return'—';const n=Number(v);if(!Number.isFinite(n))return String(v);if(n>0&&n<0.0001)return'Tr';return n.toLocaleString('pt-BR',{maximumFractionDigits:d})};
const per100=(food,key,grams)=>{const v=tacoNum(food[key]);return v===null?null:v*grams/100};
function vAlimentos(){
 if(tacoStatus==='idle'){loadTaco();return `<section class="card"><h2>Banco de alimentos TACO</h2><p>Carregando a tabela nutricional...</p><p class="hint">Na primeira utilização, é necessária conexão com a internet para carregar os 597 alimentos.</p></section>`}
 if(tacoStatus==='loading')return `<section class="card"><h2>Banco de alimentos TACO</h2><p>Carregando a tabela nutricional...</p></section>`;
 if(tacoStatus==='error')return `<section class="card"><h2>Banco de alimentos TACO</h2><p>Não foi possível carregar a base automaticamente.</p><p class="hint">Verifique sua conexão e reabra esta aba. A base consultada é a TACO 4ª edição, NEPA/UNICAMP, 2011.</p><button data-a="retrytaco">Tentar novamente</button></section>`;
 const q=(document.getElementById('tacoSearch')?.value||'').trim().toLocaleLowerCase('pt-BR');
 const cat=document.getElementById('tacoCategory')?.value||'';
 const filtered=tacoFoods.map((f,i)=>({...f,_idx:i})).filter(f=>(!q||f.descricao.toLocaleLowerCase('pt-BR').includes(q))&&(!cat||f.categoria===cat));
 const cats=[...new Set(tacoFoods.map(f=>f.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const selected=selectedTaco!==null?tacoFoods[selectedTaco]:null;
 const rows=filtered.slice(0,100).map(f=>`<tr><td class="food-name">${esc(f.descricao)}</td><td>${tacoFmt(f.energia_kcal)}</td><td>${tacoFmt(f.proteina_g)}</td><td>${tacoFmt(f.carboidrato_g)}</td><td>${tacoFmt(f.lipideos_g)}</td><td>${tacoFmt(f.fibra_g)}</td><td><button data-a="selecttaco" data-i="${f._idx}">Ver / adicionar</button></td></tr>`).join('');
 const detail=selected?`<section class="card"><h2>${esc(selected.descricao)}</h2><p class="hint">Valores calculados proporcionalmente à quantidade informada. Base da tabela: por 100 g da parte comestível.</p><div class="row"><label class="f" style="flex:1">Refeição<select id="tacoMeal">${MEALS.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label><label class="f" style="flex:1">Quantidade em gramas<input id="tacoGrams" type="number" min="0.1" step="any" value="100"></label></div><div class="nutri-detail">${TACO_FIELDS.map(([k,n,u])=>`<div><span>${n} (${u})</span><b data-taco-value="${k}">${tacoFmt(per100(selected,k,100))}</b><span>para 100 g</span></div>`).join('')}</div><div class="row"><button data-a="addtaco">Adicionar ao diário de ${dm(cur)}</button></div><p class="source-note">“Tr” significa traço (valor muito pequeno); “—” indica dado não informado/analisado na fonte, não necessariamente zero.</p></section>`:'';
 return `<section class="card"><h2>Banco de alimentos TACO</h2><p class="hint">Pesquise e escolha um alimento para consultar a composição nutricional e adicioná-lo ao diário. A base reúne ${tacoFoods.length} alimentos.</p><div class="food-tools"><input id="tacoSearch" placeholder="Buscar: arroz, banana, frango..." value="${esc(document.getElementById('tacoSearch')?.value||'')}"><select id="tacoCategory"><option value="">Todas as categorias</option>${cats.map(c=>`<option value="${esc(c)}" ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><p class="hint">Mostrando ${Math.min(filtered.length,100)} de ${filtered.length} resultados${filtered.length>100?' — refine a busca para ver opções mais específicas.':''}.</p><div class="food-table-wrap"><table class="food-table"><thead><tr><th>Alimento (preparo conforme TACO)</th><th>kcal</th><th>Proteína (g)</th><th>Carboidrato (g)</th><th>Lipídeos (g)</th><th>Fibra (g)</th><th>Ação</th></tr></thead><tbody>${rows||'<tr><td colspan="7">Nenhum alimento encontrado.</td></tr>'}</tbody></table></div><p class="source-note">Fonte: Tabela Brasileira de Composição de Alimentos (TACO), 4ª edição revisada e ampliada, NEPA/UNICAMP, 2011. Valores por 100 g. Os nutrientes apresentados dependem dos campos disponíveis na base; “—” significa dado não informado. A consulta online exige internet.</p></section>${detail}`;
}
function vTacoInline(meal){
 if(tacoStatus==='idle'){loadTaco();return `<div class="taco-inline"><p class="hint">Carregando a tabela TACO...</p></div>`}
 if(tacoStatus==='loading')return `<div class="taco-inline"><p class="hint">Carregando alimentos da TACO...</p></div>`;
 if(tacoStatus==='error')return `<div class="taco-inline"><p class="hint">Não foi possível carregar a tabela TACO. Confira a internet e tente novamente.</p><button class="g" data-a="retrytaco">Tentar novamente</button></div>`;
 const q=tacoSearchQuery.trim().toLocaleLowerCase('pt-BR');
 const results=tacoFoods.map((f,i)=>({...f,_idx:i})).filter(f=>!q||f.descricao.toLocaleLowerCase('pt-BR').includes(q)).slice(0,20);
 const selected=selectedTaco!==null?tacoFoods[selectedTaco]:null;
 return `<div class="taco-inline"><label class="f">Pesquisar alimento na TACO<input id="tacoSearch" placeholder="Digite: arroz, banana, frango..." value="${esc(tacoSearchQuery)}"></label>
 <div class="barcode-tools"><h3 style="font-size:14px;margin:0">Ou escaneie um produto embalado</h3><p class="hint" style="margin:0">Consulta a base Open Food Facts. Confira os valores da embalagem antes de registrar.</p><div class="row"><button class="g" data-a="startscanner">📷 Abrir câmera e escanear</button></div>${barcodeScannerOpen?`<video id="barcodeVideo" class="barcode-video" autoplay muted playsinline></video><p class="barcode-status">${esc(barcodeStatus||'Aponte a câmera para o código de barras.')}</p><button class="g" data-a="stopscanner">Fechar câmera</button>`:''}<div class="row"><input id="barcodeInput" inputmode="numeric" placeholder="Ou digite o código de barras" value=""><button data-a="lookupbarcode">Buscar código</button></div>${barcodeStatus&&!barcodeScannerOpen?`<p class="barcode-status">${esc(barcodeStatus)}</p>`:''}${barcodeProduct?`<div class="barcode-product"><b>${esc(barcodeProduct.name||'Produto sem nome')}</b><p class="hint">${esc(barcodeProduct.brand||'Marca não informada')} · por 100 g/ml: ${barcodeProduct.kcal==null?'kcal não informadas':tacoFmt(barcodeProduct.kcal)+' kcal'} · P ${barcodeProduct.p==null?'—':tacoFmt(barcodeProduct.p)+' g'} · C ${barcodeProduct.c==null?'—':tacoFmt(barcodeProduct.c)+' g'} · G ${barcodeProduct.fat==null?'—':tacoFmt(barcodeProduct.fat)+' g'}</p><div class="row"><label class="f" style="flex:1">Quantidade (g ou ml)<input id="barcodeGrams" type="number" min="0.1" step="any" value="100"></label><button data-a="addbarcode">Adicionar ao ${mealName(meal)}</button></div><p class="source-note">Dados colaborativos; podem estar incompletos ou incorretos. Confira o rótulo.</p></div>`:''}</div>
 <p class="hint">Escolha um resultado da TACO para ver nutrientes por porção. Exibindo até 20 resultados.</p>
 <div class="taco-results">${results.map(f=>`<button class="taco-result ${selectedTaco===f._idx?'chosen':''}" data-a="selecttaco" data-i="${f._idx}"><span>${esc(f.descricao)}</span><small>${tacoFmt(f.energia_kcal)} kcal · P ${tacoFmt(f.proteina_g)} g · C ${tacoFmt(f.carboidrato_g)} g</small></button>`).join('')||'<p class="hint">Nenhum alimento encontrado. Tente outro termo.</p>'}</div>
 ${selected?`<div class="taco-selected"><h3>${esc(selected.descricao)}</h3><div class="row"><label class="f" style="flex:1">Quantidade (g)<input id="tacoGrams" type="number" min="0.1" step="any" value="100"></label></div><div class="nutri-detail">${TACO_FIELDS.map(([k,n,u])=>`<div><span>${n} (${u})</span><b data-taco-value="${k}">${tacoFmt(per100(selected,k,100))}</b><span class="nutri-grams">para 100 g</span></div>`).join('')}</div><div class="row"><button data-a="addtaco">Adicionar ao ${mealName(meal)}</button></div><p class="source-note">Valores proporcionais à porção, com base na TACO 4ª edição. “—” indica dado não informado.</p></div>`:''}
 </div>`;
}
function stopBarcodeScanner(){
 if(barcodeFrame)cancelAnimationFrame(barcodeFrame);barcodeFrame=0;
 try{window.__ozivyZXingControls?.stop();window.__ozivyZXingControls=null;}catch(e){}
 if(barcodeStream){barcodeStream.getTracks().forEach(t=>t.stop());barcodeStream=null;}
 barcodeScannerOpen=false;
}
async function startBarcodeScanner(){
 barcodeStatus='';
 if(!navigator.mediaDevices?.getUserMedia){barcodeStatus='A câmera não está disponível neste navegador/contexto. Digite o código manualmente.';render();return;}
 try{
  barcodeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  const video=document.getElementById('barcodeVideo');if(!video)throw new Error('Área da câmera não encontrada');
  video.srcObject=barcodeStream;await video.play();barcodeStatus='Aponte a câmera para o código de barras.';
  const statusEl=document.querySelector('.barcode-status');if(statusEl)statusEl.textContent=barcodeStatus;
  const v=document.getElementById('barcodeVideo');if(!v)throw new Error('Área da câmera não encontrada');
  if('BarcodeDetector' in window){
   const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','itf']});

  addfavorite:b=>{const f=(S.favorites||[])[+b.dataset.i];if(!f)return;const copy=JSON.parse(JSON.stringify(f));copy.meal=b.dataset.v||'cafe';day(cur).food.push(copy)},
  unfavorite:b=>{if(!Array.isArray(S.favorites))return;S.favorites.splice(+b.dataset.i,1)},
  repeatmeal:b=>{const mk=b.dataset.v,prev=S.days[add(cur,-1)],items=(prev?.food||[]).filter(f=>(f.meal||'outro')===mk);if(!items.length){alert('Não há alimentos registrados nessa refeição no dia anterior.');return}const d=day(cur);d.food.push(...items.map(f=>JSON.parse(JSON.stringify(f))));},
  ex:()=>{const n=val('en');if(!n)return;day(cur).ex.push({n,m:num(val('em'))})},
  med:b=>{const d=day(cur),m=S.meds[+b.dataset.i];d.meds[m]=!d.meds[m]},
  medel:b=>{S.meds.splice(+b.dataset.i,1)},
  medadd:()=>{const n=val('mn');if(n&&!S.meds.includes(n))S.meds.push(n)},
  del:b=>{const l=b.dataset.l,i=+b.dataset.i;(l=='food'||l=='ex'?day(cur)[l]:S[l]).splice(i,1)},
  wt:()=>{const kg=num(val('wk'));if(!kg)return;S.weights=S.weights.filter(w=>w.d!=cur);S.weights.push({d:cur,kg});S.weights.sort((a,b)=>a.d<b.d?-1:1)},
  ms:()=>{const m={d:cur};let any=0;MS.forEach(([k])=>{const v=num(val('m_'+k));if(v){m[k]=v;any=1}});if(!any)return;S.meas=S.meas.filter(x=>x.d!=cur);S.meas.push(m);S.meas.sort((a,b)=>a.d<b.d?-1:1)},
  dose:()=>{const mg=num(val('dg'));if(!mg){alert('Informe a dose em mg conforme a sua prescrição.');return}S.doses=S.doses.filter(x=>x.d!=cur);S.doses.push({d:cur,c:num(val('dc')),mg});S.doses.sort((a,b)=>a.d<b.d?-1:1)},
  symptom:b=>{const d=day(cur);d.symptoms=d.symptoms||{};d.symptoms[b.dataset.k]=b.checked},
  notes:()=>{day(cur).notes=val('notes')},
  export:()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-acompanhamento-'+today()+'.json';a.click();URL.revokeObjectURL(url)},
  import:()=>document.getElementById('backupfile').click(),
  theme:()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':r.dataset.theme==='light'?'dark':'dark'},
  openTaco:b=>{const m=b.dataset.v;if(tacoMealActive===m){tacoMealActive='';selectedTaco=null;tacoSearchQuery='';barcodeProduct=null;barcodeStatus='';stopBarcodeScanner()}else{tacoMealActive=m;selectedTaco=null;tacoSearchQuery='';barcodeMeal=m;barcodeProduct=null;barcodeStatus='';if(tacoStatus==='idle')loadTaco()}},
  stopscanner:()=>{stopBarcodeScanner();barcodeStatus='Câmera fechada.'},
  lookupbarcode:()=>{barcodeMeal=tacoMealActive||'cafe';lookupBarcode(document.getElementById('barcodeInput')?.value||'')},
  addbarcode:()=>{if(!barcodeProduct)return;const grams=num(document.getElementById('barcodeGrams')?.value);if(grams<=0){alert('Informe uma quantidade maior que zero.');return}const p=barcodeProduct,scale=grams/100;day(cur).food.push({n:p.name+(p.brand?' — '+p.brand:''),meal:tacoMealActive||barcodeMeal||'cafe',grams,k:p.kcal===null?null:p.kcal*scale,p:p.p===null?null:p.p*scale,c:p.c===null?null:p.c*scale,g:p.fat===null?null:p.fat*scale,fiber:p.fiber===null?null:p.fiber*scale,barcode:p.code,source:'Open Food Facts'});barcodeProduct=null;barcodeStatus='';stopBarcodeScanner();tacoMealActive='';selectedTaco=null;tacoSearchQuery='';},
  selecttaco:b=>{selectedTaco=+b.dataset.i},
  retrytaco:()=>{tacoStatus='idle';loadTaco()},
  addtaco:()=>{if(selectedTaco===null)return;const f=tacoFoods[selectedTaco],grams=num(val('tacoGrams'));if(grams<=0){alert('Informe uma quantidade em gramas maior que zero.');return}
   const get=k=>{const v=per100(f,k,grams);return v===null?0:v};
   day(cur).food.push({n:f.descricao,k:get('energia_kcal'),p:get('proteina_g'),c:get('carboidrato_g'),g:get('lipideos_g'),fiber:per100(f,'fibra_g',grams),grams,meal:tacoMealActive||'cafe',taco:true,nutrients:Object.fromEntries(TACO_FIELDS.map(([k])=>[k,per100(f,k,grams)]))});
   tab='hoje';selectedTaco=null;tacoMealActive='';tacoSearchQuery='';
  }
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!S)return;
  const action=b.dataset.a;
  if(action==='symptom')return;
  if(action==='startscanner'){barcodeMeal=tacoMealActive||'cafe';barcodeScannerOpen=true;barcodeStatus='Preparando câmera...';render();startBarcodeScanner();return;}
  if(action==='import') { document.getElementById('backupfile').click(); return; }
  if(action==='export'||action==='theme'){A[action](b);if(action==='theme')render();return;}
  A[action](b);save();render();
});
document.addEventListener('input',e=>{
 if(e.target.id==='tacoSearch'){
   tacoSearchQuery=e.target.value;
   const start=e.target.selectionStart;
   const app=document.getElementById('app');
   app.innerHTML=app.querySelector('header').outerHTML+vHoje();
   document.getElementById('nav').innerHTML=[['hoje','Hoje'],['corpo','Progresso'],['ozivy','Ozivy']].map(([t,n])=>`<button data-a="tab" data-v="${t}" class="${tab==t?'on':''}">${n}</button>`).join('');
   app.insertAdjacentHTML('beforeend',`<section class="card"><h2>Seus dados</h2><p class="hint">Faça uma cópia de segurança para não depender apenas dos dados salvos neste navegador.</p><div class="actions"><button class="g" data-a="export">Exportar backup</button><button class="g" data-a="import">Importar backup</button><button class="g" data-a="theme">Alternar tema</button></div><input id="backupfile" type="file" accept="application/json,.json" style="display:none"><p class="save-status">${esc(saveStatusText())}</p><p class="hint">Os dados ficam neste navegador, a menos que o ambiente de hospedagem ofereça sincronização. Exporte regularmente e teste a restauração periodicamente.</p></section>`);
   const input=document.getElementById('tacoSearch');
   if(input){input.focus();try{input.setSelectionRange(start,start)}catch(err){}}
 }
 if(e.target.id==='tacoGrams'&&selectedTaco!==null){const f=tacoFoods[selectedTaco],g=Math.max(0,num(e.target.value));TACO_FIELDS.forEach(([k])=>{const el=document.querySelector('[data-taco-value="'+k+'"]');if(el)el.textContent=tacoFmt(per100(f,k,g));});document.querySelectorAll('.nutri-grams').forEach(el=>el.textContent='para '+tacoFmt(g)+' g');}
});
document.addEventListener('change',e=>{
  if(e.target.id==='tacoCategory'){render();return;}
  if(e.target.matches('input[data-a="symptom"]')){A.symptom(e.target);save();return;}
  if(e.target.id==='backupfile'&&e.target.files&&e.target.files[0]){const file=e.target.files[0],reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported||!Array.isArray(imported.weights)||!Array.isArray(imported.doses)||!imported.days)throw new Error('invalid');if(confirm('Importar este backup substituirá os dados atuais. Antes, será criada uma cópia de segurança dos dados atuais neste navegador. Deseja continuar?')){try{localStorage.setItem(LS+'-before-import',JSON.stringify(S))}catch(e){}S=imported;S.favorites=Array.isArray(S.favorites)?S.favorites:[];S.goals=Object.assign({water:2500,kcal:0,prot:100,carb:0,fat:0,fiber:25},S.goals||{});S.meas=Array.isArray(S.meas)?S.meas:[];S.weights=Array.isArray(S.weights)?S.weights:[];S.doses=Array.isArray(S.doses)?S.doses:[];S.meds=Array.isArray(S.meds)?S.meds:[];S.days=S.days||{};Object.keys(S.days).forEach(k=>{const d=S.days[k];d.food=Array.isArray(d.food)?d.food:[];d.ex=Array.isArray(d.ex)?d.ex:[];d.meds=d.meds||{};d.symptoms=d.symptoms||{};d.notes=d.notes||'';d.water=Number(d.water)||0});save();render();alert('Backup importado. Uma cópia anterior foi preservada no armazenamento local, se disponível.')}}catch(err){alert('Não foi possível importar: arquivo inválido.')} };reader.readAsText(file);e.target.value='';}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.goal;if(!k)return;
  S.goals[k]=num(e.target.value);if(k=='water'&&!S.goals.water)S.goals.water=2500;save();render();
});
(async()=>{
  cur=today();
  S=(await load())||seed();
  S.goals=Object.assign({water:2500,kcal:0,prot:100,carb:0,fat:0,fiber:25},S.goals);
  S.favorites=Array.isArray(S.favorites)?S.favorites:[];
  Object.keys(S.days||{}).forEach(k=>{S.days[k].symptoms=S.days[k].symptoms||{};S.days[k].notes=S.days[k].notes||'';S.days[k].food=S.days[k].food||[];S.days[k].ex=S.days[k].ex||[];S.days[k].meds=S.days[k].meds||{};S.days[k].water=S.days[k].water||0;});
  render();
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Não foi possível ativar o modo instalável/offline.',err)));
}
</script>
